---
layout: default
---

<article>
  <header class="post-header">
    {% if page.tag %}
      <span class="post-tag">{{ page.tag }}</span>
    {% endif %}
    <h1 class="post-header__title">{{ page.title }}</h1>
    <div class="post-header__meta">
      {{ page.date | date: "%B %-d, %Y" }} &middot; {{ page.read_time | default: "4 min read" }}
    </div>
  </header>

  {% if page.hero_image %}
    <img class="post-hero" src="{{ page.hero_image }}" alt="{{ page.title }}">
  {% endif %}

  <div class="post-body">
    {{ content }}
  </div>
</article>
